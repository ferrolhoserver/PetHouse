<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PetHouse — Teste OCR Offline</title>
  <style>body{margin:0;padding:24px;background:#071a2b;color:#dceeff;font-family:ui-monospace,monospace}h1{font:700 20px system-ui}pre{padding:16px;border:1px solid #2b4b68;border-radius:12px;background:#0d263d;white-space:pre-wrap}body[data-status="passed"] pre{border-color:#2ba56b}body[data-status="failed"] pre{border-color:#e45b5b}</style>
</head>
<body><h1>Teste isolado — OCR offline</h1><pre id="result">Executando…</pre>
<script src="/js/core/offline-runtime.js?v=3"></script>
<script>
(async () => {
  const result = document.querySelector('#result');
  const steps = [];
  const record = (name, passed, detail = '') => steps.push({ name, passed: Boolean(passed), detail });
  try {
    const runtime = window.PetHouseOfflineRuntime;
    record('runtime offline carregado', Boolean(runtime));
    record('motor OCR ainda não foi carregado na abertura', !window.Tesseract);
    await runtime.ensureTesseract();
    record('motor OCR local carregado sob demanda', Boolean(window.Tesseract));
    const response = await fetch('/tests/ocr-fixture.png');
    const blob = await response.blob();
    const worker = await Tesseract.createWorker(runtime.OCR_LANGUAGE, 1, runtime.OCR_OPTIONS);
    const { data: { text } } = await worker.recognize(blob);
    await worker.terminate();
    record('arquivo processado localmente', /VACINA\s*V8/i.test(text) && /12\/08\/2026/.test(text), text.trim());
  } catch (error) {
    record('execução OCR local', false, error?.message || String(error));
  }
  const passed = steps.every(step => step.passed);
  document.body.dataset.status = passed ? 'passed' : 'failed';
  result.textContent = JSON.stringify({ passed, steps }, null, 2);
  window.__ocrHarness = { passed, steps };
})();
</script></body></html>
